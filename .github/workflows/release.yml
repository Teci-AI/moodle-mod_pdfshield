# Pushing a version tag publishes the release: git tag v1.0.1 && git push origin v1.0.1
# Before tagging: raise $plugin->version and set $plugin->release to the same version in version.php, and add its
# section to CHANGES.md ("## 1.0.1 (date)"). The job refuses a tag that does not match either. It builds the zip, takes
# the release notes from CHANGES.md and publishes the GitHub release with the zip attached (a tag such as v1.1.0-beta.1
# makes a pre-release). The zip is what goes to the moodle.org plugins directory (uploaded there by hand).
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: The tag matches version.php and has its CHANGES.md section
        run: |
          version="${GITHUB_REF_NAME#v}"
          release=$(sed -n "s/^[$]plugin->release *= *'\([^']*\)';.*/\1/p" version.php)
          [ "$release" = "$version" ] || { echo "::error::version.php says release '$release', the tag says '$version'"; exit 1; }
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGES.md | tail -n +2 > notes.md
          [ -s notes.md ] || { echo "::error::CHANGES.md has no '## $version' section"; exit 1; }
      - id: build
        run: echo "zip=$(bash bin/build.sh "$GITHUB_REF_NAME" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Publish the release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" --verify-tag $prerelease \
            --title "PDF Shield ${GITHUB_REF_NAME#v}" --notes-file notes.md
